name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build
        shell: bash
        run: |
          dotnet publish -c Release -r win-x86 -o out -p:Version=1.0.${{ github.run_number }}
          mkdir dist
          cp out/Launcher.exe dist/Launcher.exe
          cp out/Launcher.exe dist/Launcher-x86.exe
          cp out/Launcher.exe dist/Launcher-arm64.exe
      - uses: actions/upload-artifact@v4
        with: { name: Launcher, path: dist/Launcher.exe }
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" dist/Launcher.exe dist/Launcher-x86.exe dist/Launcher-arm64.exe --title "USB Desktop 1.0.${{ github.run_number }}" --notes "Download Launcher.exe. The x86 and arm64 files are identical copies so older versions can still auto-update"
