name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet publish -c Release -o out -p:Version=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: Launcher, path: out/Launcher.exe }
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" out/Launcher.exe --title "USB Desktop 1.0.${{ github.run_number }}" --notes "Automatic build"
