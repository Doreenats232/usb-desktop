name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build all
        shell: bash
        run: |
          V=1.0.${{ github.run_number }}
          dotnet publish -c Release -r win-x64 -o out/x64 -p:Version=$V
          dotnet publish -c Release -r win-x86 -o out/x86 -p:Version=$V
          dotnet publish -c Release -r win-arm64 -o out/arm64 -p:Version=$V
          mkdir dist
          cp out/x64/Launcher.exe dist/Launcher.exe
          cp out/x86/Launcher.exe dist/Launcher-x86.exe
          cp out/arm64/Launcher.exe dist/Launcher-arm64.exe
      - uses: actions/upload-artifact@v4
        with: { name: Launcher, path: dist/*.exe }
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" dist/Launcher.exe dist/Launcher-x86.exe dist/Launcher-arm64.exe --title "USB Desktop 1.0.${{ github.run_number }}" --notes "Launcher.exe = 64-bit Windows, Launcher-x86.exe = 32-bit Windows, Launcher-arm64.exe = ARM Windows"
